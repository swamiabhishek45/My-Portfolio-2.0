services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-change-me-local}

volumes:
  qdrant_storage:

# Production: put Caddy/nginx in front for TLS and restrict 6333 to localhost + proxy HTTPS.
